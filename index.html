        /* LUXURY GRADIENT: Bottom-Left Platinum Gray/White to Top-Right Metallic Gold Champagne */
        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background: linear-gradient(225deg, #f3ede0 0%, #faf9f5 50%, #eaebed 100%);

            margin: 0;
            padding: 40px 20px 120px 20px;
            color: #1a1a1a;
            -webkit-font-smoothing: antialiased;
        }

        header {
            text-align: center;
            margin-bottom: 50px;
        }

        h1 {
            font-weight: 800;
            text-transform: uppercase;
            color: #111111;
            margin: 0 0 8px 0;
            letter-spacing: 3px;
            font-size: 2.8rem;
        }

        .subtitle {
            font-size: 1rem;
            color: #8c8f94;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 400;
        }

        /* CONTROL PANEL: Search and Sort Bars Container */
        .control-panel {
            max-width: 1450px;
            margin: 0 auto 40px auto;
            background: rgba(255, 255, 255, 0.85);
            padding: 20px 30px;
            border-radius: 16px;
            border: 1px solid rgba(230, 233, 237, 0.7);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.02);
            backdrop-filter: blur(10px);
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            align-items: center;
            justify-content: space-between;
        }

        .search-wrapper {
            flex: 1;
            min-width: 300px;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 14px 20px;
            font-size: 0.95rem;
            border: 1px solid #dcdfe6;
            border-radius: 8px;
            background: #ffffff;
            color: #1a1a1a;
            outline: none;
            transition: all 0.2s ease;
            box-sizing: border-box;
        }

        .search-input:focus {
            border-color: #d4af37;
            box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.15);
        }

        .sort-group {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .sort-select {
            padding: 14px 25px;
            font-size: 0.9rem;
            font-weight: 500;
            border: 1px solid #dcdfe6;
            border-radius: 8px;
            background: #ffffff;
            color: #333;
            cursor: pointer;
            outline: none;
            transition: all 0.2s ease;
        }

        .sort-select:focus, .sort-select:hover {
            border-color: #d4af37;
        }

        /* CARD SHOWCASE GRID */
        .car-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 35px;
            max-width: 1450px;
            margin: 0 auto;
        }

        .car-slot {
            background: rgba(255, 255, 255, 0.92);
            border: 1px solid #eef1f5;
            border-radius: 16px;
            padding: 26px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.02);
            transition: all 0.35s cubic-bezier(0.25, 0.8, 0.25, 1);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .car-slot:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 45px rgba(212, 175, 55, 0.12);
            border-color: #d4af37;
        }

        .car-slot img {
            width: 100%;
            height: 230px;
            object-fit: cover;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.04);
            background-color: #f7f7f7;
        }

        .car-title {
            font-size: 1.35rem;
            margin: 24px 0 6px 0;
            font-weight: 700;
            color: #111111;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            letter-spacing: -0.3px;
        }

        .car-price {
            color: #1a1a1a;
            font-weight: 600;
            font-size: 1.4rem;
            margin-bottom: 24px;
            text-align: center;
            letter-spacing: 0.5px;
        }

        .btn-details {
            background-color: #111111;
            color: #ffffff;
            padding: 14px 20px;
            border-radius: 9px;
            font-size: 0.9rem;
            border: none;
            cursor: pointer;
            font-weight: 600;
            width: 100%;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            transition: background-color 0.2s ease;
        }

        .btn-details:hover {
            background-color: #d4af37;
        }

        .compare-checkbox-container {
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid #edf1f6;
            font-size: 0.85rem;
            font-weight: 500;
            color: #7f8c8d;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            cursor: pointer;
            user-select: none;
        }

        .compare-checkbox-container input {
            width: 19px;
            height: 19px;
            accent-color: #d4af37;
            cursor: pointer;
        }

        /* EXPANDED INTERFACE SCREENS (DETAILS / COMPARE) */
        #detail-view, #compare-view {
            display: none;
            background: rgba(255, 255, 255, 0.97);
            max-width: 1100px;
            margin: 30px auto;
            padding: 50px;
            border-radius: 24px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.05);
            border: 1px solid rgba(238, 238, 238, 0.7);
        }

        #detail-img {
            width: 100%;
            max-height: 520px;
            object-fit: contain;
            border-radius: 16px;
            background-color: #f9fafb;
            margin-bottom: 40px;
        }

        .btn-back {
            background-color: #7f8c8d;
            color: #ffffff;
            padding: 14px 32px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.95rem;
            margin-top: 40px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: background-color 0.2s;
        }

        .btn-back:hover {
            background-color: #111111;
        }

        /* METRIC SHEETS AND SPECIFICATION TABLES */
        .stats-table, .compare-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 25px;
        }

        .stats-table th, .stats-table td, .compare-table th, .compare-table td {
            padding: 16px 22px;
            border-bottom: 1px solid #f0f3f7;
            font-size: 0.95rem;
        }

        .stats-table th {
            background-color: #f8f9fa;
            color: #4a5568;
            font-weight: 600;
            width: 40%;
            text-align: left;
        }

        .compare-table th {
            background-color: #111111;
            color: #ffffff;
            font-weight: 600;
            font-size: 1rem;
        }

        .compare-table .stat-name {
            font-weight: 600;
            text-align: left;
            background-color: #f8f9fa;
            width: 28%;
        }

            background-color: #f3faf4 !important;
            color: #2e7d32;
            font-weight: 600;
        }

        .summary-box {
            background: #fefcf9;
            border: 1px solid #ebdcc5;
            padding: 24px;
            border-radius: 12px;
            margin-bottom: 35px;
            text-align: center;
            font-size: 1.25rem;
            font-weight: 600;
            color: #111111;
            letter-spacing: -0.2px;

            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(255, 255, 255, 0.92);
            padding: 24px;

            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 40px;
            border-top: 1px solid #edf1f6;
        }

        .btn-compare-trigger {
            background-color: #d4af37;
            color: #ffffff;
            border: none;
            padding: 16px 40px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 9px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.25s ease;
        }

        .btn-compare-trigger:hover {
            background-color: #111111;
        }

        .btn-compare-trigger:disabled {
            background-color: #cbd5e0;
            cursor: not-allowed;
        }

        @media (max-width: 1300px) { .car-grid { grid-template-columns: repeat(3, 1fr); } }
        @media (max-width: 950px) { .car-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 650px) { 
            .car-grid { grid-template-columns: 1fr; }
            .control-panel { flex-direction: column; align-items: stretch; }
            #detail-view, #compare-view { padding: 25px; }
            .compare-bar { flex-direction: column; gap: 15px; text-align: center; }

        // SYSTEM LAYOUT COMPUTATION AND RENDER REFRESH ENGINE
        function renderActiveFleet() {
            const grid = document.getElementById('main-grid');
            grid.innerHTML = "";
            
            if(viewableFleetState.length === 0) {
                grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; padding: 60px; font-size: 1.2rem; color: #8c8f94; font-weight: 500;">No pristine vehicles match your specified matrix query criteria.</div>`;
                return;
            }

            viewableFleetState.forEach((car) => {
                // Find index matching global object configuration safely
                const originalIndex = carDatabase.findIndex(original => original.id === car.id);
                const isChecked = selectedForCompare.includes(car.id) ? "checked" : "";
                
                const slot = document.createElement('div');
                slot.className = 'car-slot';
                slot.innerHTML = `
                    <div>
                        <img src="${car.img}" alt="${car.name}">
                        <div class="car-title">${car.name}</div>
                        <div class="car-price">${car.priceDisplay}</div>
                    </div>
                    <div>
                        <button class="btn-details" onclick="showDetails(${originalIndex})">View Analysis Specifications</button>
                        <label class="compare-checkbox-container">
                            <input type="checkbox" id="chk-${car.id}" ${isChecked} onchange="toggleCompareExecution('${car.id}')">
                            Queue for System Confrontation
                        </label>
                    </div>
                `;
                grid.appendChild(slot);
            });
        }

        // INTELLIGENT FILTER AND COMPREHENSIVE DUAL SORT MATCHING ALGORYTHM
        function processLayoutFiltering() {
            const searchInput = document.getElementById('search-bar').value.toLowerCase().trim();
            const priceSortValue = document.getElementById('sort-price').value;
            const alphaSortValue = document.getElementById('sort-alpha').value;

            // Filtration Routine Phase
            let computationalMatrix = carDatabase.filter(car => {
                const queryMatch = car.name.toLowerCase().includes(searchInput);
                const engineMatch = car.stats.engineType.toLowerCase().includes(searchInput);
                return queryMatch || engineMatch;
            });

            // Sorting Processing Logic Phase (Price Metric)
            if (priceSortValue === "high-low") {
                computationalMatrix.sort((alpha, beta) => beta.priceNum - alpha.priceNum);
            } else if (priceSortValue === "low-high") {
                computationalMatrix.sort((alpha, beta) => alpha.priceNum - beta.priceNum);
            }

            // Sorting Processing Logic Phase (Alphabetical Orientation Metric)
            if (alphaSortValue === "a-z") {
                computationalMatrix.sort((alpha, beta) => alpha.name.localeCompare(beta.name));
            } else if (alphaSortValue === "z-a") {
                computationalMatrix.sort((alpha, beta) => beta.name.localeCompare(alpha.name));
            }

            viewableFleetState = computationalMatrix;
            renderActiveFleet();
        }

        function hideAllViews() {
            document.getElementById('shop-view').style.display = 'block';
            document.getElementById('detail-view').style.display = 'none';
            document.getElementById('compare-view').style.display = 'none';
            window.scrollTo(0, 0);
        }

        function showDetails(index) {
            const car = carDatabase[index];
            document.getElementById('shop-view').style.display = 'none';
            document.getElementById('detail-view').style.display = 'block';
            
            document.getElementById('detail-title').innerText = car.name;
            document.getElementById('detail-price').innerText = `Base Manufacturer Valuation Point: ${car.priceDisplay}`;
            document.getElementById('detail-img').src = car.img;

            const table = document.getElementById('stats-table-content');
            table.innerHTML = "";
            
            for (let key in statLabels) {
                const valueData = (key === 'priceNum') ? car.priceDisplay : `${car.stats[key]}${statLabels[key].unit}`;
                const row = document.createElement('tr');
                row.innerHTML = `
                    <th>${statLabels[key].label}</th>
                    <td>${valueData}</td>
                `;
                table.appendChild(row);
            }
            window.scrollTo(0, 0);
        }

        function toggleCompareExecution(carId) {
            const checkbox = document.getElementById(`chk-${carId}`);
            
            if (checkbox && checkbox.checked) {
                if (selectedForCompare.length >= 2) {
                    checkbox.checked = false;
                    alert("System Limits Exceeded: You may only confront two architectural models concurrently.");
                    return;
                }
                if (!selectedForCompare.includes(carId)) {
                    selectedForCompare.push(carId);
                }
            } else {
                selectedForCompare = selectedForCompare.filter(id => id !== carId);
            }

            const currentCount = selectedForCompare.length;
            document.getElementById('compare-status-text').innerText = `Select two elite models for complete technical confrontation (${currentCount}/2)`;
            document.getElementById('compare-submit-btn').disabled = (currentCount !== 2);
        }

        // DEEP MECHANICAL STRUCTURAL PARSING COMPARISON CALCULATOR
        function startComparison() {
            if (selectedForCompare.length !== 2) return;

            const car1 = carDatabase.find(c => c.id === selectedForCompare[0]);
            const car2 = carDatabase.find(c => c.id === selectedForCompare[1]);

            document.getElementById('shop-view').style.display = 'none';
            document.getElementById('compare-view').style.display = 'block';

            let structuralPerformancePoints1 = 0;
            let structuralPerformancePoints2 = 0;

            const tableContent = document.getElementById('compare-table-content');
            tableContent.innerHTML = `
                <tr>
                    <th class="stat-name">Comprehensive Mechanical Dimension</th>
                    <th>${car1.name}</th>
                    <th>${car2.name}</th>
                </tr>
            `;

            for (let key in statLabels) {
                const rule = statLabels[key];
                let rawVal1 = (key === 'priceNum') ? car1.priceNum : car1.stats[key];
                let rawVal2 = (key === 'priceNum') ? car2.priceNum : car2.stats[key];

                let outputDisplayVal1 = (key === 'priceNum') ? car1.priceDisplay : `${car1.stats[key]}${rule.unit}`;
                let outputDisplayVal2 = (key === 'priceNum') ? car2.priceDisplay : `${car2.stats[key]}${rule.unit}`;

                let computationalClassElement1 = "";
                let computationalClassElement2 = "";

                if (rule.type === "numeric" && rawVal1 !== rawVal2) {
                    if (rule.higherIsBetter) {
                        if (rawVal1 > rawVal2) { computationalClassElement1 = "higher-value-cell"; structuralPerformancePoints1++; } 
                        else { computationalClassElement2 = "higher-value-cell"; structuralPerformancePoints2++; }
                    } else {
                        if (rawVal1 < rawVal2) { computationalClassElement1 = "higher-value-cell"; structuralPerformancePoints1++; } 
                        else { computationalClassElement2 = "higher-value-cell"; structuralPerformancePoints2++; }
                    }
                }

                const row = document.createElement('tr');
                row.innerHTML = `
                    <td class="stat-name">${rule.label}</td>
                    <td class="${computationalClassElement1}">${outputDisplayVal1}</td>
                    <td class="${computationalClassElement2}">${outputDisplayVal2}</td>
                `;
                tableContent.appendChild(row);
            }

            const summaryOutputBox = document.getElementById('comparison-summary');
            if (structuralPerformancePoints1 > structuralPerformancePoints2) {
                summaryOutputBox.innerText = `The ${car1.name} outperforms across a broader profile spectrum, achieving higher scoring data vectors in ${structuralPerformancePoints1} out of 19 verifiable metrics.`;
            } else if (structuralPerformancePoints2 > structuralPerformancePoints1) {
                summaryOutputBox.innerText = `The ${car2.name} outperforms across a broader profile spectrum, achieving higher scoring data vectors in ${structuralPerformancePoints2} out of 19 verifiable metrics.`;
            } else {
                summaryOutputBox.innerText = `Complete Architectural Equilibrium: Both elite assets hold equivalent structural scoring vectors at exactly ${structuralPerformancePoints1} engineering parameter attributes each.`;
            }

            window.scrollTo(0, 0);
        }

        // INITIAL ENGINE LOAD BOOTSTRAP
        window.onload = function() {
            renderActiveFleet();
        };
    </script>
</body>
</html>
