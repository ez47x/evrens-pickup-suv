<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apex Dynamics | Premium Vehicle Showroom</title>
    <!-- Inter Font & FontAwesome Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #1c1a17 0%, #161719 40%, #0f1011 100%);
            --accent-gold: #d4af37;
            --gold-glow: rgba(212, 175, 55, 0.15);
            --luxury-gray: #1f2124;
            --card-bg: rgba(26, 28, 32, 0.75);
            --border-color: rgba(212, 175, 55, 0.2);
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Luxurious Dynamic Lighting Background Elements */
        body::before {
            content: '';
            position: fixed;
            top: -10%;
            right: -10%;
            width: 60vw;
            height: 60vh;
            background: radial-gradient(circle, rgba(212,175,55,0.08) 0%, rgba(0,0,0,0) 70%);
            z-index: 0;
            pointer-events: none;
        }

        body::after {
            content: '';
            position: fixed;
            bottom: -10%;
            left: -10%;
            width: 60vw;
            height: 60vh;
            background: radial-gradient(circle, rgba(74,85,104,0.12) 0%, rgba(0,0,0,0) 70%);
            z-index: 0;
            pointer-events: none;
        }

        header {
            position: relative;
            z-index: 10;
            padding: 3.5rem 2rem 2rem 2rem;
            text-align: center;
            max-width: 1200px;
            margin: 0 auto;
        }

        .brand-subtitle {
            font-family: 'Playfair Display', serif;
            color: var(--accent-gold);
            font-size: 1.1rem;
            letter-spacing: 0.35em;
            text-transform: uppercase;
            margin-bottom: 0.5rem;
            font-style: italic;
        }

        header h1 {
            font-size: 3rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            text-transform: uppercase;
            background: linear-gradient(180deg, #ffffff 0%, #a3a3a3 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 2.5rem;
        }

        /* Filter & Search Controls Panel */
        .controls-container {
            position: relative;
            z-index: 10;
            max-width: 1100px;
            margin: 0 auto 3rem auto;
            padding: 1.5rem;
            background: rgba(20, 22, 25, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-top: 1px solid var(--border-color);
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            display: grid;
            grid-template-columns: 2fr 1fr 1fr;
            gap: 1.25rem;
            align-items: center;
        }

        @media (max-width: 850px) {
            .controls-container {
                grid-template-columns: 1fr;
            }
        }

        .search-wrapper {
            position: relative;
            width: 100%;
        }

        .search-wrapper i {
            position: absolute;
            left: 1.25rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--accent-gold);
            font-size: 1.1rem;
            opacity: 0.8;
        }

        .search-wrapper input {
            width: 100%;
            padding: 1rem 1rem 1rem 3.2rem;
            background: rgba(10, 11, 13, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 0.95rem;
            font-weight: 400;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .search-wrapper input:focus {
            outline: none;
            border-color: var(--accent-gold);
            box-shadow: 0 0 15px var(--gold-glow);
            background: rgba(15, 16, 19, 0.9);
        }

        .select-wrapper {
            position: relative;
            width: 100%;
        }

        .select-wrapper i {
            position: absolute;
            left: 1.25rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            font-size: 1rem;
            pointer-events: none;
        }

        .select-wrapper select {
            width: 100%;
            padding: 1rem 1rem 1rem 3rem;
            background: rgba(10, 11, 13, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            appearance: none;
            -webkit-appearance: none;
            transition: all 0.3s ease;
        }

        .select-wrapper select:focus {
            outline: none;
            border-color: var(--accent-gold);
            box-shadow: 0 0 15px var(--gold-glow);
        }

        .select-wrapper::after {
            content: '\f107';
            font-family: 'Font Awesome 6 Free';
            font-weight: 900;
            position: absolute;
            right: 1.25rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--accent-gold);
            pointer-events: none;
        }

        /* Showroom Grid Grid Layout */
        .showroom-grid {
            position: relative;
            z-index: 10;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 2rem 5rem 2rem;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 2.5rem;
        }

        /* Vehicle Card Masterpieces */
        .vehicle-card {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.03);
            border-bottom: 2px solid rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            transition: all 0.45s cubic-bezier(0.25, 1, 0.5, 1);
            display: flex;
            flex-direction: column;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .vehicle-card:hover {
            transform: translateY(-10px);
            border-color: var(--border-color);
            box-shadow: 0 25px 50px rgba(0,0,0,0.5), 0 0 30px rgba(212, 175, 55, 0.06);
        }

        .image-container {
            position: relative;
            width: 100%;
            height: 220px;
            background: #0d0e10;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .vehicle-card:hover .image-container img {
            transform: scale(1.06);
        }

        /* Visual Tag Overlay */
        .propulsion-badge {
            position: absolute;
            top: 1.25rem;
            right: 1.25rem;
            padding: 0.4rem 0.9rem;
            background: rgba(10, 11, 13, 0.75);
            border: 1px solid var(--border-color);
            border-radius: 30px;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: var(--accent-gold);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            z-index: 2;
        }

        .card-content {
            padding: 1.75rem;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1.25rem;
        }

        .title-block h3 {
            font-size: 1.35rem;
            font-weight: 700;
            color: var(--text-primary);
            line-height: 1.2;
            margin-bottom: 0.25rem;
        }

        .title-block .model-year {
            font-size: 0.85rem;
            color: var(--accent-gold);
            font-weight: 600;
            letter-spacing: 0.05em;
        }

        .price-tag {
            font-size: 1.4rem;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: -0.02em;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        .price-tag::before {
            content: 'MSRP';
            font-size: 0.65rem;
            font-weight: 600;
            color: var(--text-secondary);
            letter-spacing: 0.1em;
            margin-bottom: 0.1rem;
        }

        /* Technical Specification Matrix */
        .specs-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.9rem;
            margin-top: auto;
            padding-top: 1.25rem;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
        }

        .spec-item {
            display: flex;
            align-items: center;
            gap: 0.65rem;
        }

        .spec-item i {
            color: var(--accent-gold);
            font-size: 0.95rem;
            width: 18px;
            text-align: center;
            opacity: 0.85;
        }

        .spec-meta {
            display: flex;
            flex-direction: column;
        }

        .spec-label {
            font-size: 0.7rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        .spec-value {
            font-size: 0.88rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        /* Dynamic Status Feedback */
        .no-results {
            grid-column: 1 / -1;
            text-align: center;
            padding: 5rem 2rem;
            background: var(--card-bg);
            border-radius: 20px;
            border: 1px dashed rgba(255,255,255,0.1);
        }

        .no-results i {
            color: var(--accent-gold);
            font-size: 3rem;
            margin-bottom: 1rem;
            opacity: 0.6;
        }

        .no-results p {
            color: var(--text-secondary);
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

    <header>
        <div class="brand-subtitle">Curated Hyper-Performance</div>
        <h1>High-End Automotive Showroom</h1>
    </header>

    <!-- Interactive Navigation Control Interface -->
    <section class="controls-container">
        <div class="search-wrapper">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="searchBar" placeholder="Search fleet by brand, model or performance profiles...">
        </div>
        
        <div class="select-wrapper">
            <i class="fa-solid fa-tags"></i>
            <select id="priceSort">
                <option value="default" disabled selected hidden>Sort by Valuation</option>
                <option value="desc">Price: High to Low</option>
                <option value="asc">Price: Low to High</option>
            </select>
        </div>

        <div class="select-wrapper">
            <i class="fa-solid fa-arrow-down-a-z"></i>
            <select id="alphaSort">
                <option value="default" disabled selected hidden>Sort Alphabetically</option>
                <option value="az">Name: A to Z</option>
                <option value="za">Name: Z to A</option>
            </select>
        </div>
    </section>

    <!-- Master Grid Interface -->
    <main class="showroom-grid" id="showroomGrid">
        <!-- Rendered Programmatically via Dataset Structure below -->
    </main>

    <!-- Core Business and UI Synchronization Logic Architecture -->
    <script>
        // Data Registry containing extended vehicle configuration arrays and parameters
        const vehicleRegistry = [
            {
                brand: "Dodge",
                model: "Durango SRT Hellcat",
                year: 2026,
                price: 144000,
                propulsion: "Supercharged Gas",
                image: "2021-dodge-durango-srt-hellcat.png",
                engine: "6.2L SRT HEMI V8",
                power: "710 HP",
                torque: "645 lb-ft",
                acceleration: "3.5s (0-60 mph)",
                towing: "8,700 lbs"
            },
            {
                brand: "Jeep",
                model: "Grand Cherokee Trackhawk",
                year: 2026,
                price: 112000,
                propulsion: "Supercharged Gas",
                image: "1150-HP-Jeep-Grand-Cherokee-Trackhawk.png",
                engine: "6.2L Supercharged V8",
                power: "707 HP",
                torque: "645 lb-ft",
                acceleration: "3.5s (0-60 mph)",
                towing: "7,200 lbs"
            },
            {
                brand: "Ford",
                model: "F-150 Lightning Platinum",
                year: 2025,
                price: 94000,
                propulsion: "Dual Motor EV",
                image: "2023-Ford-Lightning-Electric-Driving-NF-24.png",
                engine: "Extended Range Battery",
                power: "580 HP",
                torque: "775 lb-ft",
                acceleration: "4.0s (0-60 mph)",
                towing: "10,000 lbs"
            },
            {
                brand: "Chevrolet",
                model: "Colorado ZR2 Bison",
                year: 2026,
                price: 63000,
                propulsion: "Turbocharged Gas",
                image: "01-2024-chevrolet-silverado-zr2-driver-1.4.png",
                engine: "2.7L TurboMax™ I4",
                power: "310 HP",
                torque: "430 lb-ft",
                acceleration: "6.6s (0-60 mph)",
                towing: "7,700 lbs"
            }
        ];

        // Core DOM Elements Accessors
        const showroomGrid = document.getElementById('showroomGrid');
        const searchBar = document.getElementById('searchBar');
        const priceSort = document.getElementById('priceSort');
        const alphaSort = document.getElementById('alphaSort');

        // Formats pricing integers into clean localized currency denominations 
        function formatCurrency(amount) {
            return '$' + amount.toLocaleString('en-US');
        }

        // Card Assembly pipeline providing semantic markup injections
        function renderShowroom(vehicles) {
            showroomGrid.innerHTML = '';
            
            if (vehicles.length === 0) {
                showroomGrid.innerHTML = `
                    <div class="no-results">
                        <i class="fa-solid fa-car-rear"></i>
                        <p>No high-performance vehicles match your current criteria.</p>
                    </div>
                `;
                return;
            }

            vehicles.forEach(vehicle => {
                const card = document.createElement('article');
                card.className = 'vehicle-card';
                card.innerHTML = `
                    <div class="image-container">
                        <span class="propulsion-badge">${vehicle.propulsion}</span>
                        <img src="${vehicle.image}" alt="${vehicle.brand} ${vehicle.model}" onerror="this.src='https://images.unsplash.com/photo-1533473359331-0135ef1b58bf?auto=format&fit=crop&q=80&w=600';">
                    </div>
                    <div class="card-content">
                        <div class="card-header">
                            <div class="title-block">
                                <span class="model-year">${vehicle.year} Edition</span>
                                <h3>${vehicle.brand} ${vehicle.model}</h3>
                            </div>
                            <div class="price-tag">${formatCurrency(vehicle.price)}</div>
                        </div>
                        <div class="specs-grid">
                            <div class="spec-item">
                                <i class="fa-solid fa-microchip"></i>
                                <div class="spec-meta">
                                    <span class="spec-label">Powertrain</span>
                                    <span class="spec-value">${vehicle.engine}</span>
                                </div>
                            </div>
                            <div class="spec-item">
                                <i class="fa-solid fa-bolt"></i>
                                <div class="spec-meta">
                                    <span class="spec-label">Output</span>
                                    <span class="spec-value">${vehicle.power}</span>
                                </div>
                            </div>
                            <div class="spec-item">
                                <i class="fa-solid fa-gauge-high"></i>
                                <div class="spec-meta">
                                    <span class="spec-label">Torque</span>
                                    <span class="spec-value">${vehicle.torque}</span>
                                </div>
                            </div>
                            <div class="spec-item">
                                <i class="fa-solid fa-stopwatch"></i>
                                <div class="spec-meta">
                                    <span class="spec-label">0-60 MPH</span>
                                    <span class="spec-value">${vehicle.acceleration}</span>
                                </div>
                            </div>
                            <div class="spec-item">
                                <i class="fa-solid fa-weight-hanging"></i>
                                <div class="spec-meta">
                                    <span class="spec-label">Towing Max</span>
                                    <span class="spec-value">${vehicle.towing}</span>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                showroomGrid.appendChild(card);
            });
        }

        // Mutation Handler handling Filtering, Structural Querying, and Priority Sorting
        function executeQueryFilter() {
            let processedFleet = [...vehicleRegistry];
            const queryToken = searchBar.value.toLowerCase().trim();

            // Eval Text Search Constraints
            if (queryToken !== "") {
                processedFleet = processedFleet.filter(car => {
                    const inlineTerms = `${car.brand} ${car.model} ${car.engine} ${car.propulsion}`.toLowerCase();
                    return inlineTerms.includes(queryToken);
                });
            }

            // Eval Price Sorting Matrix
            if (priceSort.value === 'desc') {
                processedFleet.sort((alpha, beta) => beta.price - alpha.price);
            } else if (priceSort.value === 'asc') {
                processedFleet.sort((alpha, beta) => alpha.price - beta.price);
            }

            // Eval Lexical Sorting Alphabetical Matrix
            if (alphaSort.value === 'az') {
                processedFleet.sort((alpha, beta) => {
                    const fullTitleA = `${alpha.brand} ${alpha.model}`.toLowerCase();
                    const fullTitleB = `${beta.brand} ${beta.model}`.toLowerCase();
                    return fullTitleA.localeCompare(fullTitleB);
                });
            } else if (alphaSort.value === 'za') {
                processedFleet.sort((alpha, beta) => {
                    const fullTitleA = `${alpha.brand} ${alpha.model}`.toLowerCase();
                    const fullTitleB = `${beta.brand} ${beta.model}`.toLowerCase();
                    return fullTitleB.localeCompare(fullTitleA);
                });
            }

            renderShowroom(processedFleet);
        }

        // Binding event listener triggers to pipeline mutations
        searchBar.addEventListener('input', executeQueryFilter);
        
        priceSort.addEventListener('change', () => {
            // Unlink conflicting alphabetical priority sorting index selections on active manipulation
            alphaSort.selectedIndex = 0;
            executeQueryFilter();
        });
        
        alphaSort.addEventListener('change', () => {
            // Unlink conflicting evaluation pricing priority index selections on active manipulation
            priceSort.selectedIndex = 0;
            executeQueryFilter();
        });

        // Initialize App State
        document.addEventListener('DOMContentLoaded', () => {
            renderShowroom(vehicleRegistry);
        });
    </script>
</body>
</html>
